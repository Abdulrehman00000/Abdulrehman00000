<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8b949e" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="10" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="860" height="4" fill="url(#accentGrad)"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="5" fill="#febc2e"/>
  <circle cx="56" cy="22" r="5" fill="#28c840"/>

  <!-- Terminal Path Label -->
  <text x="76" y="26" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12">Abdulrehman00000@developer-station ~ $ init_profile.sh</text>

  <!-- Main Title -->
  <text x="32" y="72" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" filter="url(#glow)">Abdul rehman Nadeem</text>

  <!-- Subtitle -->
  <text x="32" y="102" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">🚀 Full-Stack & Web Developer  |  💻 Intermediate Student  |  📍 Karachi, Pakistan</text>

  <!-- Status Pill -->
  <g transform="translate(620, 65)">
    <rect width="210" height="30" rx="15" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="4" fill="#39d353">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" fill="#39d353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Available for Projects</text>
  </g>
</svg>